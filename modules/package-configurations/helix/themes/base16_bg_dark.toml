# base16_bg_dark.toml
#
# A dark theme in the spirit of tonsky's Alabaster "BG" variant, built on the
# base16 default dark palette. Syntax is distinguished by BACKGROUND blocks
# rather than foreground colors, but with punchier jewel-tone blocks than
# wolf-alabaster-dark-bg so it stays lively over long sessions.
#
# Philosophy (from Alabaster): only a few categories are highlighted.
#   * strings     -> green block
#   * comments    -> amber block
#   * definitions -> blue block   (functions, methods, types, constructors, tags)
#   * constants   -> kept as a foreground color for contrast
# Everything else (keywords, variables, operators) stays default foreground.

inherits = "base16_default_dark"

# --- SYNTAX: background-block variant ---------------------------------------
# Text stays bright (base05); categories are told apart by the block behind them.

"string" = { fg = "base06", bg = "string-bg" }
"string.regexp" = { fg = "base06", bg = "string-bg" }
"string.special" = { fg = "base06", bg = "string-bg-bright" }

# Constants keep a foreground color (magenta-ish base09/base0E family) — this is
# the one splash of fg color, exactly as Alabaster BG does it.
"constant" = { fg = "constant" }
"constant.numeric" = { fg = "constant" }
"constant.character" = { fg = "constant" }
"constant.builtin" = { fg = "constant" }
"constant.character.escape" = { fg = "base06", bg = "string-bg-bright" }

"comment" = { fg = "base05", bg = "comment-bg" }
"comment.line" = { fg = "base05", bg = "comment-bg" }
"comment.block" = { fg = "base05", bg = "comment-bg" }

"function" = { fg = "base06", bg = "definition-bg" }
"function.builtin" = { fg = "base06", bg = "definition-bg" }
"function.method" = { fg = "base06", bg = "definition-bg" }

"constructor" = { fg = "base06", bg = "definition-bg" }
"type" = { fg = "base06", bg = "definition-bg" }
"type.builtin" = { fg = "base06", bg = "definition-bg" }

# Special cases
"tag" = { fg = "base06", bg = "definition-bg" }

# Keep everything else uncolored (Alabaster philosophy: keywords are obvious)
"keyword" = { fg = "base05" }
"keyword.control" = { fg = "base05" }
"keyword.operator" = { fg = "base05" }
"operator" = { fg = "base05" }
"variable" = { fg = "base05" }
"variable.parameter" = { fg = "base05" }
"variable.builtin" = { fg = "base05" }
"variable.other.member" = { fg = "base05" }
"namespace" = { fg = "base05" }
"attribute" = { fg = "base05" }
"label" = { fg = "constant" }

# --- MARKUP -----------------------------------------------------------------
"markup.heading" = { fg = "base06", bg = "definition-bg", modifiers = ["bold"] }
"markup.list" = { fg = "base05" }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.link.url" = { fg = "base06", bg = "string-bg", modifiers = ["underlined"] }
"markup.link.text" = { fg = "base06", bg = "definition-bg" }
"markup.quote" = { fg = "base05", bg = "comment-bg" }
"markup.raw" = { fg = "base06", bg = "string-bg" }

# --- DIFF -------------------------------------------------------------------
"diff.plus" = { fg = "base06", bg = "string-bg" }
"diff.minus" = { fg = "base06", bg = "error-bg" }
"diff.delta" = { fg = "constant" }

# --- UI tweaks --------------------------------------------------------------
# Brighter selections so they read over the colored syntax blocks.
"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection-primary" }

[palette]
# Syntax block backgrounds — saturated jewel tones, noticeably livelier than
# wolf-alabaster-dark-bg but still dark enough that base06 text pops on them.
string-bg = "#22481A"          # deep green    - strings
string-bg-bright = "#356A20"   # brighter green - escapes / special strings
definition-bg = "#163B57"      # deep blue     - functions, types, headings
comment-bg = "#4A3A12"         # deep amber    - comments (meant to be seen)
error-bg = "#571F1F"           # deep red      - diff removals / errors

# Foreground splash for constants (base16 orange-ish); use base0E magenta if you
# prefer that over orange — both live in the inherited palette.
constant = "#dc9656"           # = base09

# Selections tuned to stay visible against the colored blocks.
selection = "#22384F"
selection-primary = "#2C4F73"
